name: Windows installer

# Builds the unsigned Windows installer and attaches it to the run, so the
# latest build of this branch can be downloaded from the Actions tab
# (open the run → Artifacts → clippy-windows-installer).
on:
  push:
    branches: [windows-support]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/win-windows.test.js test/server.test.js test/bridge.test.js
      - run: node scripts/win-helper-smoke.js
      - run: npm run package:win
      - run: npm run package:bridge
      - uses: actions/upload-artifact@v4
        with:
          name: clippy-windows-installer
          path: |
            dist/Clippy-for-Claude-Code-Setup-*.exe
            dist/clippy-bridge-*.vsix
          if-no-files-found: error
